<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZ Competition</title>
    <link rel="stylesheet" href="estilorz.css">
    <script src="codigo.js"></script>
</head>
<body>
    <div class="contenedor">
        <div class="inicio">
            <h1>RZ Competition</h1>
            <p>Taller de reprogramaciones en Córdoba de alta performance.</p>

            <p>Usuario:
                <input type="text" id="Usuario" placeholder="Indique su usuario">
            </p>

            <p>Contraseña:
                <input type="password" id="Contraseña" placeholder="Indique su contraseña">
            </p>

            <button onclick="ingresar()">INGRESAR</button>
            <button onclick="limpiar()">LIMPIAR</button>
            <button onclick="invitado()">INVITADO</button>
        </div>

        <div class="info">
            <h2>Te invitamos a conocernos</h2>
            <button onclick="conocenos()">¿QUIÉNES SOMOS?</button>

            <h2>Nuestra tienda</h2>
            <button onclick="shop()">TIENDA</button>
        </div>
    </div>
</body>
</html>
